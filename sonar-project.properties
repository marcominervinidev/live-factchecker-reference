# SonarQube Cloud (Free, Frankfurt), owner decision 2026-10-19: advisory, decision DUE 2026-12-18 (docs/process/due.md), then the Quality Gate on
# new code becomes a required check with the coverage condition removed (coverage is not a gate here; mutation is).
# Activation coupled to the first service is pending owner decision (#122, reminder v2 issue #3).
# sonar.sources and sonar.tests name the repository root, which always exists: the scanner fails on a listed
# directory that does not (apps before increment 2, issue #42). The inclusions pick the code directories as they
# appear; test files are excluded from the sources so no file is indexed twice.
# The owner creates the project and sets SONAR_TOKEN as a repository secret (docs/process/pr-format.md).
sonar.organization=marcominervinidev
sonar.projectKey=marcominervinidev_live-factcheck_2
sonar.projectName=live-factchecker-v2
sonar.sources=.
sonar.inclusions=apps/**,services/**,packages/**,scripts/**
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,evals/golden/**,**/*.generated.*,**/*.test.ts,**/*.test.tsx,tests/**
sonar.sourceEncoding=UTF-8
